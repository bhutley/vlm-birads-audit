# Paper-number manifest: links every number reported in ajcai/ (main text, appendix,
# supplement) to the result artefact and JSON location it comes from.
# Design constants (m, d, draw counts, alpha) are omitted; they live in configs/.

manifest_version: 1
paper: Auditing BI-RADS Expressibility of Breast-Ultrasound Decisions in Frozen Vision-Language Models (AJCAI 2026)
conventions:
  paper: LaTeX file and \label (or section) where the number is printed, relative to ajcai/sections/
  reported: the value exactly as printed; its decimal places set the rounding used for comparison
  pointer: RFC 6901 JSON Pointer into `artifact` (list indices are integers)
  derive: used instead of `pointer` when the printed number is computed from several artifact values; `*` ranges over sites or backbones
  value: the unrounded artifact value (or derivation result) at the time this manifest was written
  scale: multiply `value` by this before comparing (percentages)
